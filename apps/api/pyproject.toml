[project]
name = "nidoguard-api"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi", "uvicorn[standard]", "sqlalchemy>=2", "psycopg[binary]", "alembic",
  "pydantic-settings", "pyjwt[crypto]", "httpx", "boto3", "anthropic",
  "qrcode[pil]", "reportlab", "pillow", "pillow-heif", "python-multipart",
]
[project.optional-dependencies]
dev = ["pytest"]
[tool.setuptools.packages.find]
include = ["app*", "admin*", "migrations*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
